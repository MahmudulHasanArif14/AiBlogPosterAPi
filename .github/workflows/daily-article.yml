name: Daily article

# One article per day, platform-wide, rotating through the enabled locations.
#
# This runs here rather than on a Vercel cron because generation takes 60-115
# seconds against the configured reasoning model, and the project's Vercel plan
# kills a function at 60 seconds. GitHub Actions has no such ceiling.
#
# The schedule is UTC, as all cron schedules are. The *slot* is keyed on the
# Europe/London calendar date in Postgres, so a BST transition can neither
# double-book a London day nor skip one. 03:10 UTC is 03:10 GMT or 04:10 BST,
# both comfortably inside the same London day.

on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - seed
          - location
      location:
        description: "Location slug, for mode=location (e.g. brighton)"
        required: false
        type: string
      topic:
        description: "Optional topic brief, for mode=location"
        required: false
        type: string

# Never let two runs generate at once. The database would reject a duplicate
# daily slot anyway, but failing here is clearer than relying on that.
concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # The seed batch generates up to five articles at 60-115 seconds each.
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3.5-super-vl:free' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SITE_URL: ${{ vars.SITE_URL || 'https://content.westerncars.com' }}
      AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED || 'false' }}
      # Generous: the worker has no function time limit here, and a slow
      # provider response is better waited out than retried tomorrow.
      AI_REQUEST_TIMEOUT_MS: "240000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20. @supabase/supabase-js constructs a RealtimeClient when
          # the client is created and throws on a runtime with no global
          # WebSocket, which Node 20 does not have.
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Generate
        # Dispatch inputs are passed as environment variables, not interpolated
        # into the script. Inline `${{ inputs.topic }}` breaks on the first
        # space and would let dispatch input execute as shell.
        env:
          MODE: ${{ inputs.mode || 'daily' }}
          INPUT_LOCATION: ${{ inputs.location }}
          INPUT_TOPIC: ${{ inputs.topic }}
        run: |
          set -euo pipefail

          case "$MODE" in
            seed)
              npx tsx scripts/generate.ts --seed
              ;;
            location)
              if [ -z "${INPUT_LOCATION:-}" ]; then
                echo "mode=location requires the location input." >&2
                exit 1
              fi
              if [ -n "${INPUT_TOPIC:-}" ]; then
                npx tsx scripts/generate.ts --location "$INPUT_LOCATION" --topic "$INPUT_TOPIC"
              else
                npx tsx scripts/generate.ts --location "$INPUT_LOCATION"
              fi
              ;;
            *)
              npx tsx scripts/generate.ts --daily
              ;;
          esac
